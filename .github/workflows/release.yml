name: Publish plugin release
on:
  push:
    branches: ['release/*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - name: Publish the version from the manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p 'require("./manifest.json").version')
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_NAME" != "release/$version" ]]; then
            echo "Release branch must match manifest version."
            exit 1
          fi
          node --check dist/main.js
          gh release create "$version" --target "$GITHUB_SHA" --title "Accretion Atlas $version" --generate-notes dist/main.js dist/manifest.json dist/styles.css
